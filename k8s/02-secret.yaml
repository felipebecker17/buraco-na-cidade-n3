# Secret: senhas do banco. Usei "stringData" para escrever em texto puro;
# o Kubernetes converte para base64 sozinho ao salvar.
# ATENÇÃO: base64 NÃO é criptografia — são senhas FICTÍCIAS de laboratório.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: n3-felipe
  labels:
    projeto: buraco-na-cidade
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "senha-exemplo-root"
  MYSQL_PASSWORD: "senha-exemplo-app"
