# Redis: cache da listagem e contador de visitas. Sem volume de propósito:
# é cache, se perder os dados a API apenas recalcula a partir do MySQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: n3-felipe
  labels:
    app: redis
    projeto: buraco-na-cidade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        projeto: buraco-na-cidade
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
