# Service NodePort: acesso externo à API em http://localhost:30080 (Docker Desktop).
# Ele encontra os pods pelo SELECTOR app=api e balanceia entre todas as réplicas prontas.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: n3-felipe
  labels:
    app: api
    projeto: buraco-na-cidade
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
